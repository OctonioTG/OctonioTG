<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0a0d14" />
    </linearGradient>

    <!-- Multi-Tone Radiant Border -->
    <linearGradient id="vibrantBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="30%" stop-color="#38bdf8" />
      <stop offset="55%" stop-color="#818cf8" />
      <stop offset="80%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Ambient Glows -->
    <radialGradient id="cyanGlow" cx="10%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="magentaGlow" cx="90%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .title-name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 38px; fill: url(#nameGrad); letter-spacing: -0.5px; }
    .title-role { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 15px; fill: #38bdf8; letter-spacing: 1.5px; text-transform: uppercase; }
    .academic-pill { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; font-weight: 600; fill: #f1f5f9; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; font-size: 13.5px; fill: #94a3b8; }
    .status-badge { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #34d399; }
    .pill-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #ffffff; }
  </style>

  <!-- Base Canvas -->
  <rect width="950" height="280" rx="14" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.2" />
  <rect width="950" height="280" rx="14" fill="url(#cyanGlow)" />
  <rect width="950" height="280" rx="14" fill="url(#magentaGlow)" />

  <!-- Top Accent Glowing Border (Clean Modern Style) -->
  <path d="M 14 1 L 936 1" stroke="url(#vibrantBorder)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Status Indicator Top -->
  <g transform="translate(45, 34)">
    <circle cx="5" cy="5" r="4" fill="#10b981" />
    <text x="18" y="9" class="status-badge">Available for Software &amp; Automation Projects</text>
  </g>

  <!-- Main Content -->
  <text x="45" y="90" class="title-name">Diego Ovalle</text>
  <text x="45" y="118" class="title-role">Technology &amp; Automation Developer</text>

  <!-- Academic Pill -->
  <g transform="translate(45, 134)">
    <rect width="470" height="26" rx="6" fill="#21262d" stroke="#38bdf8" stroke-width="1" />
    <circle cx="14" cy="13" r="3.5" fill="#38bdf8" />
    <text x="26" y="17" class="academic-pill">Computer Science Engineering &bull; Engineering Physics (50%)</text>
  </g>

  <!-- Tagline -->
  <text x="45" y="188" class="subtitle">"I use technology to solve real-world problems, automate workflows and continuously improve processes."</text>

  <!-- Clean Bottom Tags -->
  <g transform="translate(45, 214)">
    <!-- Pill 1 -->
    <rect width="140" height="28" rx="6" fill="#161b22" stroke="#38bdf8" stroke-width="1" />
    <circle cx="14" cy="14" r="3" fill="#38bdf8" />
    <text x="26" y="18" class="pill-label">Problem Solver</text>

    <!-- Pill 2 -->
    <g transform="translate(152, 0)">
      <rect width="160" height="28" rx="6" fill="#161b22" stroke="#f97316" stroke-width="1" />
      <circle cx="14" cy="14" r="3" fill="#f97316" />
      <text x="26" y="18" class="pill-label">Process Automation</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(324, 0)">
      <rect width="170" height="28" rx="6" fill="#161b22" stroke="#10b981" stroke-width="1" />
      <circle cx="14" cy="14" r="3" fill="#10b981" />
      <text x="26" y="18" class="pill-label">Lean Six Sigma &amp; QA</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(506, 0)">
      <rect width="165" height="28" rx="6" fill="#161b22" stroke="#c084fc" stroke-width="1" />
      <circle cx="14" cy="14" r="3" fill="#c084fc" />
      <text x="26" y="18" class="pill-label">Applied Physics &amp; SDR</text>
    </g>
  </g>
</svg>