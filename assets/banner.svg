<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 280" width="100%" height="100%">
  <style>
    .title-name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 38px; fill: #ffffff; letter-spacing: -0.5px; }
    .title-role { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 15px; fill: #38bdf8; letter-spacing: 1.5px; text-transform: uppercase; }
    .academic-pill { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; font-weight: 600; fill: #f1f5f9; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; font-size: 13.5px; fill: #94a3b8; }
    .status-badge { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #34d399; }
    .pill-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #ffffff; }
  </style>

  <!-- Solid Flat Base -->
  <rect width="950" height="280" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />

  <!-- Solid Top Accent Bar (Cyan Blue) -->
  <rect x="0" y="0" width="950" height="4" rx="2" fill="#38bdf8" />

  <!-- Status Indicator -->
  <g transform="translate(45, 34)">
    <circle cx="5" cy="5" r="4" fill="#10b981" />
    <text x="18" y="9" class="status-badge">Available for Software &amp; Automation Projects</text>
  </g>

  <!-- Name & Role -->
  <text x="45" y="92" class="title-name">Diego Ovalle</text>
  <text x="45" y="120" class="title-role">Technology &amp; Automation Developer</text>

  <!-- Academic Pill -->
  <g transform="translate(45, 136)">
    <rect width="470" height="26" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <circle cx="14" cy="13" r="3.5" fill="#38bdf8" />
    <text x="26" y="17" class="academic-pill">Computer Science Engineering &#8226; Engineering Physics (50%)</text>
  </g>

  <!-- Tagline -->
  <text x="45" y="190" class="subtitle">"I use technology to solve real-world problems, automate workflows and continuously improve processes."</text>

  <!-- Solid Bottom Tags -->
  <g transform="translate(45, 216)">
    <rect width="140" height="28" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <circle cx="14" cy="14" r="3" fill="#38bdf8" />
    <text x="26" y="18" class="pill-label">Problem Solver</text>

    <g transform="translate(152, 0)">
      <rect width="160" height="28" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <circle cx="14" cy="14" r="3" fill="#f97316" />
      <text x="26" y="18" class="pill-label">Process Automation</text>
    </g>

    <g transform="translate(324, 0)">
      <rect width="170" height="28" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <circle cx="14" cy="14" r="3" fill="#10b981" />
      <text x="26" y="18" class="pill-label">Lean Six Sigma &amp; QA</text>
    </g>

    <g transform="translate(506, 0)">
      <rect width="165" height="28" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <circle cx="14" cy="14" r="3" fill="#c084fc" />
      <text x="26" y="18" class="pill-label">Applied Physics &amp; SDR</text>
    </g>
  </g>
</svg>