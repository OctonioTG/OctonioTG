<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0c121e" />
      <stop offset="100%" stop-color="#05080f" />
    </linearGradient>

    <!-- Blue Glow Gradient -->
    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Orange Flame Gradient -->
    <linearGradient id="orangeAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#1e293b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.9" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="cyanRadial" cx="15%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orangeRadial" cx="85%" cy="65%" r="55%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1e293b" stroke-width="0.65" stroke-opacity="0.4" />
      <circle cx="0" cy="0" r="1" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    .title-name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 800; font-size: 38px; fill: #ffffff; letter-spacing: -0.5px; }
    .title-role { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 15px; fill: #38bdf8; letter-spacing: 1.5px; text-transform: uppercase; }
    .academic-pill { font-family: 'SF Mono', Consolas, monospace; font-size: 11px; font-weight: 600; fill: #cbd5e1; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 400; font-size: 13.5px; fill: #94a3b8; }
    .hud-text { font-family: 'SF Mono', Consolas, monospace; font-size: 10.5px; fill: #f97316; letter-spacing: 1.2px; font-weight: 600; }
    .hud-dim { font-family: 'SF Mono', Consolas, monospace; font-size: 10.5px; fill: #64748b; letter-spacing: 1px; }
    .tag-text { font-family: 'SF Mono', Consolas, monospace; font-size: 11px; font-weight: 600; fill: #e2e8f0; }
    .pkmn-label { font-family: 'SF Mono', Consolas, monospace; font-size: 9.5px; font-weight: 600; fill: #94a3b8; letter-spacing: 0.8px; }
  </style>

  <!-- Base Canvas -->
  <rect width="950" height="300" rx="16" fill="url(#bgGrad)" />
  <rect width="950" height="300" rx="16" fill="url(#cyanRadial)" />
  <rect width="950" height="300" rx="16" fill="url(#orangeRadial)" />
  <rect width="950" height="300" rx="16" fill="url(#cyberGrid)" />

  <!-- Outer HUD Frame -->
  <rect x="2" y="2" width="946" height="296" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Corner Brackets -->
  <path d="M 18 38 L 18 18 L 38 18" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 912 18 L 932 18 L 932 38" fill="none" stroke="#f97316" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 18 262 L 18 282 L 38 282" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 912 282 L 932 282 L 932 262" fill="none" stroke="#f97316" stroke-width="2.5" stroke-linecap="round" />

  <!-- Top Status Bar -->
  <g transform="translate(45, 34)">
    <circle cx="5" cy="5" r="4" fill="#10b981" />
    <circle cx="5" cy="5" r="6.5" fill="none" stroke="#10b981" stroke-width="1" opacity="0.6" />
    <text x="20" y="9" class="hud-dim">STATUS: DEPLOYED</text>
    <text x="145" y="9" class="hud-dim">•</text>
    <text x="160" y="9" class="hud-text">CLASS: TECHNOLOGY &amp; AUTOMATION DEVELOPER</text>
    <text x="500" y="9" class="hud-dim">•</text>
    <text x="515" y="9" class="hud-dim">CS ENG + ENG PHYSICS (50%)</text>
  </g>

  <!-- Right Side Cyber Pokéball Wireframe & Tactical Squad -->
  <g transform="translate(745, 145)" opacity="0.18">
    <circle cx="0" cy="0" r="100" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 5" />
    <circle cx="0" cy="0" r="90" fill="none" stroke="#64748b" stroke-width="1.2" />
    <path d="M -90 0 A 90 90 0 0 1 90 0 Z" fill="#f97316" fill-opacity="0.15" />
    <line x1="-100" y1="0" x2="-28" y2="0" stroke="#38bdf8" stroke-width="4" />
    <line x1="28" y1="0" x2="100" y2="0" stroke="#f97316" stroke-width="4" />
    <circle cx="0" cy="0" r="28" fill="#0d131f" stroke="#e2e8f0" stroke-width="3" />
    <circle cx="0" cy="0" r="14" fill="#0d131f" stroke="#38bdf8" stroke-width="2.5" />
    <circle cx="0" cy="0" r="6" fill="#f97316" />
  </g>

  <!-- Left Content Area -->
  <text x="45" y="98" class="title-name">Diego Ovalle</text>
  <text x="45" y="128" class="title-role">Technology &amp; Automation Developer</text>

  <!-- Dual Engineering Pill -->
  <g transform="translate(45, 142)">
    <rect width="505" height="24" rx="5" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
    <circle cx="12" cy="12" r="3.5" fill="#38bdf8" />
    <text x="24" y="16" class="academic-pill">Computer Science Engineering  +  Engineering Physics (50%)</text>
  </g>

  <!-- Tagline -->
  <text x="45" y="196" class="subtitle">"I use technology to solve real-world problems, automate workflows and continuously improve processes."</text>

  <!-- Bottom Core Pillars -->
  <g transform="translate(45, 218)">
    <!-- Pill 1: Problem Solving -->
    <g transform="translate(0, 0)">
      <rect width="160" height="28" rx="6" fill="#111827" stroke="#38bdf8" stroke-width="1" />
      <circle cx="14" cy="14" r="3.5" fill="#38bdf8" />
      <text x="26" y="18" class="tag-text">Problem Solver</text>
    </g>

    <!-- Pill 2: Process Automation -->
    <g transform="translate(172, 0)">
      <rect width="180" height="28" rx="6" fill="#111827" stroke="#f97316" stroke-width="1" />
      <circle cx="14" cy="14" r="3.5" fill="#f97316" />
      <text x="26" y="18" class="tag-text">Process Automation</text>
    </g>

    <!-- Pill 3: Lean Six Sigma -->
    <g transform="translate(364, 0)">
      <rect width="190" height="28" rx="6" fill="#111827" stroke="#64748b" stroke-width="1" />
      <circle cx="14" cy="14" r="3.5" fill="#10b981" />
      <text x="26" y="18" class="tag-text">Continuous Improvement</text>
    </g>

    <!-- Pill 4: Applied Physics & RF -->
    <g transform="translate(566, 0)">
      <rect width="175" height="28" rx="6" fill="#111827" stroke="#64748b" stroke-width="1" />
      <circle cx="14" cy="14" r="3.5" fill="#a855f7" />
      <text x="26" y="18" class="tag-text">Applied Physics &amp; SDR</text>
    </g>
  </g>

  <!-- Bottom Aesthetic Border -->
  <line x1="45" y1="274" x2="420" y2="274" stroke="url(#blueAccent)" stroke-width="2" stroke-linecap="round" />
  <line x1="430" y1="274" x2="620" y2="274" stroke="url(#orangeAccent)" stroke-width="2" stroke-linecap="round" />
  <line x1="630" y1="274" x2="905" y2="274" stroke="#334155" stroke-width="1" stroke-linecap="round" />
</svg>