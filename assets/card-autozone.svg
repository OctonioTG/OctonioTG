<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="100%" height="100%">
  <style>
    .type-pill { font-family: 'SF Mono', Consolas, monospace; font-size: 10px; font-weight: 800; fill: #ffffff; letter-spacing: 1px; }
    .dex-num { font-family: 'SF Mono', Consolas, monospace; font-size: 10px; font-weight: 700; fill: #f97316; letter-spacing: 1px; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 20px; font-weight: 800; fill: #ffffff; letter-spacing: -0.3px; }
    .card-role { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #fb923c; }
    .card-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12.5px; fill: #94a3b8; }
    .ability-title { font-family: 'SF Mono', Consolas, monospace; font-size: 10px; font-weight: 800; fill: #f97316; letter-spacing: 1.2px; }
    .ability-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #cbd5e1; font-weight: 500; }
    .tag-label { font-family: 'SF Mono', Consolas, monospace; font-size: 9.5px; font-weight: 700; fill: #ffffff; }
  </style>

  <!-- Solid Dark Card Base -->
  <rect width="480" height="270" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5" />

  <!-- Solid Top Accent Bar (Fire Orange) -->
  <rect x="0" y="0" width="480" height="4" rx="2" fill="#f97316" />

  <!-- Top Bar: Type Pill & Dex ID -->
  <g transform="translate(22, 20)">
    <rect width="130" height="22" rx="6" fill="#c2410c" />
    <circle cx="11" cy="11" r="3.5" fill="#fef08a" />
    <text x="22" y="14.5" class="type-pill">FIRE / STEEL</text>

    <text x="436" y="15" text-anchor="end" class="dex-num">DEX // #001 &#8226; ENTERPRISE</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="22" y="70" class="card-title">AutoZone Compliance Tools</text>
  <text x="22" y="90" class="card-role">Supply Chain Global Compliance &#8226; Workflow Automation</text>

  <!-- Solid Divider Line -->
  <line x1="22" y1="102" x2="458" y2="102" stroke="#21262d" stroke-width="1.5" />

  <!-- Description -->
  <text x="22" y="124" class="card-desc">Automated validation tools and incident tracking pipelines built to</text>
  <text x="22" y="142" class="card-desc">diagnose bottlenecks and standardize operational workflows.</text>

  <!-- Pokédex Ability Box (Solid Background) -->
  <g transform="translate(22, 158)">
    <rect width="436" height="42" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <text x="14" y="16" class="ability-title">SPECIAL ABILITY // WORKFLOW OVERCLOCK</text>
    <text x="14" y="32" class="ability-text">&#9658; Standardized incident response diagrams &amp; cut verification bottlenecks</text>
  </g>

  <!-- Bottom Solid Tags -->
  <g transform="translate(22, 222)">
    <rect width="78" height="24" rx="6" fill="#9a3412" />
    <text x="14" y="16" class="tag-label">PYTHON</text>

    <g transform="translate(86, 0)">
      <rect width="102" height="24" rx="6" fill="#0369a1" />
      <text x="13" y="16" class="tag-label">AUTOMATION</text>
    </g>

    <g transform="translate(196, 0)">
      <rect width="102" height="24" rx="6" fill="#854d0e" />
      <text x="12" y="16" class="tag-label">PROCESS MAP</text>
    </g>

    <g transform="translate(306, 0)">
      <rect width="95" height="24" rx="6" fill="#581c87" />
      <text x="12" y="16" class="tag-label">COMPLIANCE</text>
    </g>
  </g>
</svg>