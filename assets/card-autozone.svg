<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" width="100%" height="100%">
  <style>
    .type-pill { font-family: 'SF Mono', Consolas, monospace; font-size: 9.5px; font-weight: 800; fill: #ffffff; letter-spacing: 0.8px; }
    .dex-num { font-family: 'SF Mono', Consolas, monospace; font-size: 9.5px; font-weight: 700; fill: #fb923c; letter-spacing: 0.8px; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 16px; font-weight: 800; fill: #ffffff; letter-spacing: -0.2px; }
    .card-role { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; font-weight: 600; fill: #fb923c; }
    .card-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; fill: #cbd5e1; }
    .ability-title { font-family: 'SF Mono', Consolas, monospace; font-size: 8.5px; font-weight: 800; fill: #fb923c; letter-spacing: 0.8px; }
    .ability-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; fill: #f8fafc; font-weight: 500; }
    .tag-label { font-family: 'SF Mono', Consolas, monospace; font-size: 8.5px; font-weight: 700; fill: #ffffff; }
  </style>

  <!-- Card Base -->
  <rect width="420" height="220" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
  <rect x="0" y="0" width="5" height="220" rx="2.5" fill="#ea580c" />

  <!-- Top Line: Type Pill & Dex -->
  <g transform="translate(16, 15)">
    <rect width="115" height="20" rx="5" fill="#c2410c" />
    <circle cx="10" cy="10" r="3" fill="#fef08a" />
    <text x="20" y="13.5" class="type-pill">FIRE / STEEL</text>
    <text x="388" y="13.5" text-anchor="end" class="dex-num">DEX // #002 &#8226; COMPLIANCE</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="16" y="58" class="card-title">AutoZone Compliance Hub</text>
  <text x="16" y="75" class="card-role">Enterprise Automation &#8226; Supply Chain</text>

  <!-- Divider -->
  <line x1="16" y1="86" x2="404" y2="86" stroke="#21262d" stroke-width="1" />

  <!-- Description (2 Lines) -->
  <text x="16" y="104" class="card-desc">Centralized platform streamlining incident analytics,</text>
  <text x="16" y="120" class="card-desc">CAR management, and automated email workflows.</text>

  <!-- Special Ability Box -->
  <g transform="translate(16, 134)">
    <rect width="388" height="38" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <text x="10" y="14" class="ability-title">SPECIAL ABILITY // COMPLIANCE AUTOMATION</text>
    <text x="10" y="28" class="ability-text">&#9658; Issues analytics, CAR management &amp; email workflows</text>
  </g>

  <!-- Tags Row -->
  <g transform="translate(16, 184)">
    <rect width="76" height="22" rx="4" fill="#0369a1" />
    <text x="8" y="15" class="tag-label">REACT / JS</text>

    <g transform="translate(82, 0)">
      <rect width="74" height="22" rx="4" fill="#0f766e" />
      <text x="8" y="15" class="tag-label">POSTGRES</text>
    </g>

    <g transform="translate(162, 0)">
      <rect width="84" height="22" rx="4" fill="#7c3aed" />
      <text x="8" y="15" class="tag-label">POWER APPS</text>
    </g>

    <g transform="translate(252, 0)">
      <rect width="56" height="22" rx="4" fill="#334155" />
      <text x="8" y="15" class="tag-label">EXCEL</text>
    </g>
  </g>
</svg>