<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 185" width="100%" height="100%">
  <style>
    .type-pill { font-family: 'SF Mono', Consolas, monospace; font-size: 10.5px; font-weight: 800; fill: #ffffff; letter-spacing: 1px; }
    .dex-num { font-family: 'SF Mono', Consolas, monospace; font-size: 11px; font-weight: 700; fill: #fb923c; letter-spacing: 1px; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 21px; font-weight: 800; fill: #ffffff; letter-spacing: -0.3px; }
    .card-role { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #fb923c; }
    .card-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; fill: #cbd5e1; }
    .ability-title { font-family: 'SF Mono', Consolas, monospace; font-size: 10px; font-weight: 800; fill: #fb923c; letter-spacing: 1px; }
    .ability-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; fill: #f8fafc; font-weight: 500; }
    .tag-label { font-family: 'SF Mono', Consolas, monospace; font-size: 9.5px; font-weight: 700; fill: #ffffff; }
  </style>

  <rect width="850" height="185" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
  <rect x="0" y="0" width="6" height="185" rx="3" fill="#ea580c" />

  <!-- Top Line: Type & Dex -->
  <g transform="translate(26, 18)">
    <rect width="130" height="22" rx="6" fill="#c2410c" />
    <circle cx="11" cy="11" r="3.5" fill="#fef08a" />
    <text x="22" y="14.5" class="type-pill">FIRE / STEEL</text>
    <text x="796" y="15" text-anchor="end" class="dex-num">DEX // #002 &#8226; SUPPLY CHAIN COMPLIANCE</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="26" y="66" class="card-title">AutoZone &#8226; Compliance Automation Hub</text>
  <text x="26" y="86" class="card-role">Enterprise Automation &#8226; Supply Chain Global Compliance</text>

  <!-- Description -->
  <text x="26" y="112" class="card-desc">Centralized platform streamlining incident analytics, CAR management, automated email workflows, and global compliance tracking.</text>

  <!-- Ability & Tags Row -->
  <g transform="translate(26, 132)">
    <rect width="455" height="36" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <text x="12" y="14" class="ability-title">SPECIAL ABILITY // COMPLIANCE AUTOMATION</text>
    <text x="12" y="28" class="ability-text">&#9658; Issues analytics, CAR management &amp; automated notification workflows</text>

    <!-- Tags Right -->
    <g transform="translate(470, 6)">
      <rect width="85" height="24" rx="5" fill="#0369a1" />
      <text x="8" y="16" class="tag-label">REACT / JS</text>

      <g transform="translate(93, 0)">
        <rect width="84" height="24" rx="5" fill="#0f766e" />
        <text x="9" y="16" class="tag-label">POSTGRES</text>
      </g>

      <g transform="translate(185, 0)">
        <rect width="90" height="24" rx="5" fill="#7c3aed" />
        <text x="8" y="16" class="tag-label">POWER APPS</text>
      </g>

      <g transform="translate(283, 0)">
        <rect width="68" height="24" rx="5" fill="#334155" />
        <text x="8" y="16" class="tag-label">EXCEL</text>
      </g>
    </g>
  </g>
</svg>