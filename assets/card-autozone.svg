<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 210" width="100%" height="100%">
  <defs>
    <linearGradient id="azTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="60%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <radialGradient id="azSpot" cx="0%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#161b22" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #ffffff; }
    .badge { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #fb923c; }
    .desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12.5px; fill: #94a3b8; line-height: 1.5; }
    .pill { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10.5px; font-weight: 600; fill: #e2e8f0; }
  </style>

  <!-- Card Background -->
  <rect width="460" height="210" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.2" />
  <rect width="460" height="210" rx="12" fill="url(#azSpot)" />

  <!-- Top Accent Glow Line (Modern Vercel / Linear Style) -->
  <path d="M 12 1 L 448 1" stroke="url(#azTop)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Icon + Badge -->
  <g transform="translate(24, 24)">
    <rect width="32" height="32" rx="8" fill="#431407" stroke="#ea580c" stroke-width="1" />
    <!-- Gear / Process Icon -->
    <path d="M 16 10 C 12.7 10 10 12.7 10 16 C 10 19.3 12.7 22 16 22 C 19.3 22 22 19.3 22 16 C 22 12.7 19.3 10 16 10 Z M 16 18 C 14.9 18 14 17.1 14 16 C 14 14.9 14.9 14 16 14 C 17.1 14 18 14.9 18 16 C 18 17.1 17.1 18 16 18 Z" fill="#fb923c" />
    <path d="M 15 7 L 17 7 L 17 9 L 15 9 Z M 15 23 L 17 23 L 17 25 L 15 25 Z M 7 15 L 9 15 L 9 17 L 7 17 Z M 23 15 L 25 15 L 25 17 L 23 17 Z" fill="#fb923c" />

    <!-- Title & Category Badge -->
    <text x="44" y="15" class="title">AutoZone Compliance Tools</text>
    <text x="44" y="30" class="badge">Supply Chain Automation &bull; Operations</text>
  </g>

  <!-- Human Description -->
  <text x="24" y="88" class="desc">Internal tools that automate compliance auditing, track incidents,</text>
  <text x="24" y="108" class="desc">and standardize operational workflows for Global Supply Chain teams.</text>

  <!-- Divider -->
  <line x1="24" y1="132" x2="436" y2="132" stroke="#21262d" stroke-width="1" />

  <!-- Modern Tech Tags -->
  <g transform="translate(24, 154)">
    <rect width="66" height="24" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <circle cx="12" cy="12" r="3" fill="#f97316" />
    <text x="20" y="15.5" class="pill">Python</text>

    <g transform="translate(74, 0)">
      <rect width="90" height="24" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
      <circle cx="12" cy="12" r="3" fill="#38bdf8" />
      <text x="20" y="15.5" class="pill">Automation</text>
    </g>

    <g transform="translate(172, 0)">
      <rect width="102" height="24" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
      <circle cx="12" cy="12" r="3" fill="#eab308" />
      <text x="20" y="15.5" class="pill">Process Map</text>
    </g>

    <g transform="translate(282, 0)">
      <rect width="90" height="24" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
      <circle cx="12" cy="12" r="3" fill="#10b981" />
      <text x="20" y="15.5" class="pill">Compliance</text>
    </g>
  </g>
</svg>