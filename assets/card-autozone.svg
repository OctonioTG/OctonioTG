<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <style>
    .type-pill { font-family: 'SF Mono', Consolas, monospace; font-size: 9.5px; font-weight: 800; fill: #ffffff; letter-spacing: 0.8px; }
    .dex-num { font-family: 'SF Mono', Consolas, monospace; font-size: 10px; font-weight: 700; fill: #fb923c; letter-spacing: 0.8px; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 19px; font-weight: 800; fill: #ffffff; letter-spacing: -0.3px; }
    .card-role { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12.5px; font-weight: 600; fill: #fb923c; }
    .card-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #cbd5e1; }
    .ability-title { font-family: 'SF Mono', Consolas, monospace; font-size: 9px; font-weight: 800; fill: #fb923c; letter-spacing: 0.8px; }
    .ability-bullet { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10.5px; fill: #f1f5f9; font-weight: 500; }
    .section-label { font-family: 'SF Mono', Consolas, monospace; font-size: 9px; font-weight: 700; fill: #64748b; letter-spacing: 0.8px; }
    .tag-label { font-family: 'SF Mono', Consolas, monospace; font-size: 9px; font-weight: 700; fill: #ffffff; }
  </style>

  <!-- Square Base -->
  <rect width="400" height="400" rx="16" fill="#161b22" stroke="#30363d" stroke-width="2" />
  <rect x="0" y="0" width="6" height="400" rx="3" fill="#ea580c" />

  <!-- Top Line: Type Pill & Dex -->
  <g transform="translate(22, 22)">
    <rect width="120" height="22" rx="6" fill="#c2410c" />
    <circle cx="11" cy="11" r="3.5" fill="#fef08a" />
    <text x="22" y="15" class="type-pill">FIRE / STEEL</text>
    <text x="356" y="15" text-anchor="end" class="dex-num">DEX // #002 &#8226; COMPLIANCE HUB</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="22" y="76" class="card-title">AutoZone Compliance Hub</text>
  <text x="22" y="96" class="card-role">Enterprise Automation &#8226; Supply Chain Global</text>

  <!-- Divider -->
  <line x1="22" y1="108" x2="378" y2="108" stroke="#30363d" stroke-width="1.2" />

  <!-- Description (3 Lines) -->
  <text x="22" y="130" class="card-desc">Centralized platform for AutoZone Supply Chain Global</text>
  <text x="22" y="148" class="card-desc">Compliance, streamlining incident analytics, internal</text>
  <text x="22" y="166" class="card-desc">tools, and reducing manual operational friction.</text>

  <!-- Special Ability Box -->
  <g transform="translate(22, 186)">
    <rect width="356" height="84" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.2" />
    <text x="12" y="19" class="ability-title">SPECIAL ABILITY // COMPLIANCE AUTOMATION</text>
    <text x="12" y="38" class="ability-bullet">&#9658; Issues Analytics: Automated DC incident tracking</text>
    <text x="12" y="56" class="ability-bullet">&#9658; CAR Management: Corrective action request workflow</text>
    <text x="12" y="74" class="ability-bullet">&#9658; Email Automation: Standardized template generation</text>
  </g>

  <!-- Tags Section -->
  <text x="22" y="296" class="section-label">ENTERPRISE TECH STACK</text>

  <!-- Row 1 Tags -->
  <g transform="translate(22, 308)">
    <rect width="90" height="24" rx="5" fill="#0369a1" />
    <text x="9" y="16" class="tag-label">REACT / JS</text>

    <g transform="translate(96, 0)">
      <rect width="96" height="24" rx="5" fill="#0f766e" />
      <text x="9" y="16" class="tag-label">POSTGRESQL</text>
    </g>

    <g transform="translate(198, 0)">
      <rect width="96" height="24" rx="5" fill="#7c3aed" />
      <text x="9" y="16" class="tag-label">POWER APPS</text>
    </g>
  </g>

  <!-- Row 2 Tags -->
  <g transform="translate(22, 340)">
    <rect width="98" height="24" rx="5" fill="#0284c7" />
    <text x="9" y="16" class="tag-label">SHAREPOINT</text>

    <g transform="translate(104, 0)">
      <rect width="84" height="24" rx="5" fill="#334155" />
      <text x="9" y="16" class="tag-label">MS EXCEL</text>
    </g>

    <g transform="translate(194, 0)">
      <rect width="100" height="24" rx="5" fill="#c2410c" />
      <text x="9" y="16" class="tag-label">WORKFLOWS</text>
    </g>
  </g>
</svg>