<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 185" width="100%" height="100%">
  <style>
    .type-pill { font-family: 'SF Mono', Consolas, monospace; font-size: 10.5px; font-weight: 800; fill: #ffffff; letter-spacing: 1px; }
    .dex-num { font-family: 'SF Mono', Consolas, monospace; font-size: 11px; font-weight: 700; fill: #22d3ee; letter-spacing: 1px; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 21px; font-weight: 800; fill: #ffffff; letter-spacing: -0.3px; }
    .card-role { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #22d3ee; }
    .card-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; fill: #cbd5e1; }
    .ability-title { font-family: 'SF Mono', Consolas, monospace; font-size: 10px; font-weight: 800; fill: #22d3ee; letter-spacing: 1px; }
    .ability-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; fill: #f8fafc; font-weight: 500; }
    .tag-label { font-family: 'SF Mono', Consolas, monospace; font-size: 9.5px; font-weight: 700; fill: #ffffff; }
  </style>

  <rect width="850" height="185" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
  <rect x="0" y="0" width="6" height="185" rx="3" fill="#06b6d4" />

  <!-- Top Line: Type & Dex -->
  <g transform="translate(26, 18)">
    <rect width="130" height="22" rx="6" fill="#0e7490" />
    <circle cx="11" cy="11" r="3.5" fill="#a5f3fc" />
    <text x="22" y="14.5" class="type-pill">WATER / ICE</text>
    <text x="796" y="15" text-anchor="end" class="dex-num">DEX // #003 &#8226; BRANCH OPERATIONS</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="26" y="66" class="card-title">Dairy Queen &#8226; Operations Management System</text>
  <text x="26" y="86" class="card-role">Business Process Automation &#8226; Operations Management</text>

  <!-- Description -->
  <text x="26" y="112" class="card-desc">Centralized management web system featuring multi-level RBAC access, maintenance tracking, and geographic branch visualization.</text>

  <!-- Ability & Tags Row -->
  <g transform="translate(26, 132)">
    <rect width="460" height="36" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <text x="12" y="14" class="ability-title">SPECIAL ABILITY // BRANCH COORDINATION</text>
    <text x="12" y="28" class="ability-text">&#9658; Multi-level role access control, maintenance tracking &amp; branch KPIs</text>

    <!-- Tags Right -->
    <g transform="translate(476, 6)">
      <rect width="68" height="24" rx="5" fill="#0369a1" />
      <text x="12" y="16" class="tag-label">REACT</text>

      <g transform="translate(76, 0)">
        <rect width="75" height="24" rx="5" fill="#047857" />
        <text x="11" y="16" class="tag-label">DJANGO</text>
      </g>

      <g transform="translate(159, 0)">
        <rect width="84" height="24" rx="5" fill="#15803d" />
        <text x="10" y="16" class="tag-label">MONGODB</text>
      </g>

      <g transform="translate(251, 0)">
        <rect width="95" height="24" rx="5" fill="#334155" />
        <text x="9" y="16" class="tag-label">RBAC / KPIS</text>
      </g>
    </g>
  </g>
</svg>