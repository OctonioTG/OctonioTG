<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" width="100%" height="100%">
  <style>
    .type-pill { font-family: 'SF Mono', Consolas, monospace; font-size: 9.5px; font-weight: 800; fill: #ffffff; letter-spacing: 0.8px; }
    .dex-num { font-family: 'SF Mono', Consolas, monospace; font-size: 9.5px; font-weight: 700; fill: #22d3ee; letter-spacing: 0.8px; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 16px; font-weight: 800; fill: #ffffff; letter-spacing: -0.2px; }
    .card-role { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; font-weight: 600; fill: #22d3ee; }
    .card-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; fill: #cbd5e1; }
    .ability-title { font-family: 'SF Mono', Consolas, monospace; font-size: 8.5px; font-weight: 800; fill: #22d3ee; letter-spacing: 0.8px; }
    .ability-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; fill: #f8fafc; font-weight: 500; }
    .tag-label { font-family: 'SF Mono', Consolas, monospace; font-size: 8.5px; font-weight: 700; fill: #ffffff; }
  </style>

  <!-- Card Base -->
  <rect width="420" height="220" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
  <rect x="0" y="0" width="5" height="220" rx="2.5" fill="#06b6d4" />

  <!-- Top Line: Type Pill & Dex -->
  <g transform="translate(16, 15)">
    <rect width="115" height="20" rx="5" fill="#0e7490" />
    <circle cx="10" cy="10" r="3" fill="#a5f3fc" />
    <text x="20" y="13.5" class="type-pill">WATER / ICE</text>
    <text x="388" y="13.5" text-anchor="end" class="dex-num">DEX // #003 &#8226; OPERATIONS</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="16" y="58" class="card-title">Dairy Queen Operations</text>
  <text x="16" y="75" class="card-role">Business Process Automation &#8226; Ops</text>

  <!-- Divider -->
  <line x1="16" y1="86" x2="404" y2="86" stroke="#21262d" stroke-width="1" />

  <!-- Description (2 Lines) -->
  <text x="16" y="104" class="card-desc">Centralized management system featuring RBAC access,</text>
  <text x="16" y="120" class="card-desc">maintenance tracking, and geographic visualization.</text>

  <!-- Special Ability Box -->
  <g transform="translate(16, 134)">
    <rect width="388" height="38" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <text x="10" y="14" class="ability-title">SPECIAL ABILITY // BRANCH COORDINATION</text>
    <text x="10" y="28" class="ability-text">&#9658; Multi-level role access, maintenance &amp; branch KPIs</text>
  </g>

  <!-- Tags Row -->
  <g transform="translate(16, 184)">
    <rect width="60" height="22" rx="4" fill="#0369a1" />
    <text x="8" y="15" class="tag-label">REACT</text>

    <g transform="translate(66, 0)">
      <rect width="68" height="22" rx="4" fill="#047857" />
      <text x="8" y="15" class="tag-label">DJANGO</text>
    </g>

    <g transform="translate(140, 0)">
      <rect width="78" height="22" rx="4" fill="#15803d" />
      <text x="8" y="15" class="tag-label">MONGODB</text>
    </g>

    <g transform="translate(224, 0)">
      <rect width="84" height="22" rx="4" fill="#334155" />
      <text x="8" y="15" class="tag-label">RBAC &amp; KPIS</text>
    </g>
  </g>
</svg>