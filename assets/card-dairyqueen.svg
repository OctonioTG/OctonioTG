<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <style>
    .type-pill { font-family: 'SF Mono', Consolas, monospace; font-size: 9.5px; font-weight: 800; fill: #ffffff; letter-spacing: 0.8px; }
    .dex-num { font-family: 'SF Mono', Consolas, monospace; font-size: 10px; font-weight: 700; fill: #22d3ee; letter-spacing: 0.8px; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 19px; font-weight: 800; fill: #ffffff; letter-spacing: -0.3px; }
    .card-role { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12.5px; font-weight: 600; fill: #22d3ee; }
    .card-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #cbd5e1; }
    .ability-title { font-family: 'SF Mono', Consolas, monospace; font-size: 9px; font-weight: 800; fill: #22d3ee; letter-spacing: 0.8px; }
    .ability-bullet { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10.5px; fill: #f1f5f9; font-weight: 500; }
    .section-label { font-family: 'SF Mono', Consolas, monospace; font-size: 9px; font-weight: 700; fill: #64748b; letter-spacing: 0.8px; }
    .tag-label { font-family: 'SF Mono', Consolas, monospace; font-size: 9px; font-weight: 700; fill: #ffffff; }
  </style>

  <!-- Square Base -->
  <rect width="400" height="400" rx="16" fill="#161b22" stroke="#30363d" stroke-width="2" />
  <rect x="0" y="0" width="6" height="400" rx="3" fill="#06b6d4" />

  <!-- Top Line: Type Pill & Dex -->
  <g transform="translate(22, 22)">
    <rect width="120" height="22" rx="6" fill="#0e7490" />
    <circle cx="11" cy="11" r="3.5" fill="#a5f3fc" />
    <text x="22" y="15" class="type-pill">WATER / ICE</text>
    <text x="356" y="15" text-anchor="end" class="dex-num">DEX // #003 &#8226; OPERATIONS HUB</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="22" y="76" class="card-title">Dairy Queen Operations</text>
  <text x="22" y="96" class="card-role">Business Process Automation &#8226; Management</text>

  <!-- Divider -->
  <line x1="22" y1="108" x2="378" y2="108" stroke="#30363d" stroke-width="1.2" />

  <!-- Description (3 Lines) -->
  <text x="22" y="130" class="card-desc">Centralized administration web platform designed to</text>
  <text x="22" y="148" class="card-desc">streamline operational management, maintenance, and</text>
  <text x="22" y="166" class="card-desc">administrative oversight across multi-branch chains.</text>

  <!-- Special Ability Box -->
  <g transform="translate(22, 186)">
    <rect width="356" height="84" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.2" />
    <text x="12" y="19" class="ability-title">SPECIAL ABILITY // BRANCH COORDINATION</text>
    <text x="12" y="38" class="ability-bullet">&#9658; Multi-Level RBAC: Role-based operational access</text>
    <text x="12" y="56" class="ability-bullet">&#9658; Maintenance Tracking: Equipment &amp; branch status</text>
    <text x="12" y="74" class="ability-bullet">&#9658; Geographic View: Interactive branch visualization</text>
  </g>

  <!-- Tags Section -->
  <text x="22" y="296" class="section-label">FULL-STACK ARCHITECTURE</text>

  <!-- Row 1 Tags -->
  <g transform="translate(22, 308)">
    <rect width="75" height="24" rx="5" fill="#0369a1" />
    <text x="9" y="16" class="tag-label">REACT</text>

    <g transform="translate(81, 0)">
      <rect width="82" height="24" rx="5" fill="#047857" />
      <text x="9" y="16" class="tag-label">DJANGO</text>
    </g>

    <g transform="translate(169, 0)">
      <rect width="90" height="24" rx="5" fill="#15803d" />
      <text x="9" y="16" class="tag-label">MONGODB</text>
    </g>
  </g>

  <!-- Row 2 Tags -->
  <g transform="translate(22, 340)">
    <rect width="112" height="24" rx="5" fill="#475569" />
    <text x="9" y="16" class="tag-label">RBAC SECURITY</text>

    <g transform="translate(118, 0)">
      <rect width="130" height="24" rx="5" fill="#0e7490" />
      <text x="9" y="16" class="tag-label">GEOGRAPHIC MAPS</text>
    </g>
  </g>
</svg>