<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="100%" height="100%">
  <defs>
    <linearGradient id="cardEdBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#032015" />
      <stop offset="40%" stop-color="#0a1724" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Holo Border Grass/Psychic -->
    <linearGradient id="holoEd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="35%" stop-color="#34d399" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <radialGradient id="glowEd" cx="85%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#059669" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .type-pill { font-family: 'SF Mono', Consolas, monospace; font-size: 10px; font-weight: 800; fill: #ffffff; letter-spacing: 1px; }
    .dex-num { font-family: 'SF Mono', Consolas, monospace; font-size: 10px; font-weight: 700; fill: #34d399; letter-spacing: 1px; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 20px; font-weight: 900; fill: #ffffff; letter-spacing: -0.3px; }
    .card-role { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #34d399; }
    .card-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12.5px; fill: #cbd5e1; }
    .ability-title { font-family: 'SF Mono', Consolas, monospace; font-size: 10px; font-weight: 800; fill: #34d399; letter-spacing: 1.2px; }
    .ability-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #a7f3d0; font-weight: 500; }
    .tag-label { font-family: 'SF Mono', Consolas, monospace; font-size: 9.5px; font-weight: 800; fill: #ffffff; }
  </style>

  <rect width="480" height="270" rx="16" fill="url(#cardEdBg)" stroke="#30363d" stroke-width="1.2" />
  <rect width="480" height="270" rx="16" fill="url(#glowEd)" />
  <rect x="2" y="2" width="476" height="266" rx="14" fill="none" stroke="url(#holoEd)" stroke-width="2" />

  <!-- Cyber Pokeball Watermark -->
  <g transform="translate(400, 75)" opacity="0.12">
    <circle cx="0" cy="0" r="55" fill="none" stroke="#10b981" stroke-width="3" />
    <path d="M -55 0 A 55 55 0 0 1 55 0 Z" fill="#10b981" />
    <line x1="-55" y1="0" x2="55" y2="0" stroke="#ffffff" stroke-width="3" />
    <circle cx="0" cy="0" r="16" fill="#0a1724" stroke="#ffffff" stroke-width="3" />
    <circle cx="0" cy="0" r="7" fill="#10b981" />
  </g>

  <!-- Top Bar: Type Pill & Dex ID -->
  <g transform="translate(22, 18)">
    <rect width="145" height="22" rx="11" fill="#065f46" stroke="#10b981" stroke-width="1.2" />
    <circle cx="11" cy="11" r="4" fill="#34d399" />
    <text x="22" y="14.5" class="type-pill">PSYCHIC / GRASS</text>

    <text x="436" y="15" text-anchor="end" class="dex-num">DEX // #004 &#8226; AI ANALYTICS</text>
  </g>

  <text x="22" y="68" class="card-title">EducaIA</text>
  <text x="22" y="87" class="card-role">Educational Intelligence &#8226; Machine Learning Analytics</text>

  <line x1="22" y1="98" x2="458" y2="98" stroke="#334155" stroke-width="1" />
  <line x1="22" y1="98" x2="160" y2="98" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" />

  <text x="22" y="120" class="card-desc">Machine learning data pipelines and predictive models that transform</text>
  <text x="22" y="138" class="card-desc">institutional student metrics into actionable pedagogical interventions.</text>

  <!-- Ability Box -->
  <g transform="translate(22, 154)">
    <rect width="436" height="42" rx="8" fill="#063e2e" stroke="#059669" stroke-width="1.2" />
    <text x="14" y="16" class="ability-title">SPECIAL ABILITY // COGNITIVE FORECAST</text>
    <text x="14" y="32" class="ability-text">&#9658; Objective predictive analytics to identify risk areas &amp; guide decisions</text>
  </g>

  <!-- Bottom Badges -->
  <g transform="translate(22, 218)">
    <rect width="78" height="24" rx="6" fill="#047857" stroke="#34d399" stroke-width="1.2" />
    <text x="14" y="16" class="tag-label">PYTHON</text>

    <g transform="translate(86, 0)">
      <rect width="78" height="24" rx="6" fill="#0369a1" stroke="#38bdf8" stroke-width="1.2" />
      <text x="14" y="16" class="tag-label">ML / AI</text>
    </g>

    <g transform="translate(172, 0)">
      <rect width="90" height="24" rx="6" fill="#854d0e" stroke="#eab308" stroke-width="1.2" />
      <text x="12" y="16" class="tag-label">ANALYTICS</text>
    </g>

    <g transform="translate(270, 0)">
      <rect width="90" height="24" rx="6" fill="#701a75" stroke="#ec4899" stroke-width="1.2" />
      <text x="12" y="16" class="tag-label">METRICS</text>
    </g>
  </g>
</svg>