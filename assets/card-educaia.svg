<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 250" width="100%" height="100%">
  <defs>
    <linearGradient id="edBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042318" />
      <stop offset="50%" stop-color="#0b1726" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="edBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="40%" stop-color="#34d399" />
      <stop offset="80%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <radialGradient id="edGlow" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .cat-tag { font-family: 'SF Mono', Consolas, monospace; font-size: 9.5px; font-weight: 800; fill: #34d399; letter-spacing: 1.5px; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 17.5px; font-weight: 800; fill: #ffffff; letter-spacing: -0.3px; }
    .card-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; font-weight: 600; fill: #34d399; }
    .card-body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #cbd5e1; line-height: 1.4; }
    .impact-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #a7f3d0; }
    .tag-text { font-family: 'SF Mono', Consolas, monospace; font-size: 9px; font-weight: 700; fill: #ffffff; }
  </style>

  <rect width="440" height="250" rx="14" fill="url(#edBg)" />
  <rect width="440" height="250" rx="14" fill="url(#edGlow)" />
  <rect x="1" y="1" width="438" height="248" rx="13" fill="none" stroke="url(#edBorder)" stroke-width="1.8" />

  <rect x="20" y="18" width="168" height="18" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1" />
  <circle cx="28" cy="27" r="3" fill="#10b981" />
  <text x="36" y="30.5" class="cat-tag">DATA &amp; MACHINE LEARNING</text>

  <text x="20" y="58" class="card-title">EducaIA &bull; Learning Analytics</text>
  <text x="20" y="76" class="card-sub">Educational Metrics &amp; Diagnostic Modeling</text>

  <line x1="20" y1="88" x2="420" y2="88" stroke="#334155" stroke-width="1" />
  <line x1="20" y1="88" x2="160" y2="88" stroke="#10b981" stroke-width="2" stroke-linecap="round" />

  <text x="20" y="108" class="card-body">Data pipelines and predictive models to transform academic student</text>
  <text x="20" y="125" class="card-body">performance metrics into actionable diagnostic insights.</text>

  <g transform="translate(20, 142)">
    <rect width="400" height="32" rx="6" fill="#063d2e" stroke="#059669" stroke-width="1" />
    <circle cx="15" cy="16" r="3.5" fill="#34d399" />
    <text x="26" y="20" class="impact-text">&bull; Objective diagnostic data to drive academic intervention</text>
  </g>

  <g transform="translate(20, 192)">
    <rect width="68" height="22" rx="5" fill="#047857" stroke="#34d399" stroke-width="1" />
    <text x="12" y="15" class="tag-text">PYTHON</text>

    <g transform="translate(74, 0)">
      <rect width="68" height="22" rx="5" fill="#0369a1" stroke="#38bdf8" stroke-width="1" />
      <text x="10" y="15" class="tag-text">ML / AI</text>
    </g>

    <g transform="translate(148, 0)">
      <rect width="82" height="22" rx="5" fill="#854d0e" stroke="#eab308" stroke-width="1" />
      <text x="10" y="15" class="tag-text">ANALYTICS</text>
    </g>

    <g transform="translate(236, 0)">
      <rect width="84" height="22" rx="5" fill="#701a75" stroke="#ec4899" stroke-width="1" />
      <text x="10" y="15" class="tag-text">STATISTICS</text>
    </g>
  </g>
</svg>
