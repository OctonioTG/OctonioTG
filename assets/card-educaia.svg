<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="100%" height="100%">
  <style>
    .type-pill { font-family: 'SF Mono', Consolas, monospace; font-size: 10px; font-weight: 800; fill: #ffffff; letter-spacing: 1px; }
    .dex-num { font-family: 'SF Mono', Consolas, monospace; font-size: 10px; font-weight: 700; fill: #10b981; letter-spacing: 1px; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 20px; font-weight: 800; fill: #ffffff; letter-spacing: -0.3px; }
    .card-role { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #34d399; }
    .card-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12.5px; fill: #94a3b8; }
    .ability-title { font-family: 'SF Mono', Consolas, monospace; font-size: 10px; font-weight: 800; fill: #10b981; letter-spacing: 1.2px; }
    .ability-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #cbd5e1; font-weight: 500; }
    .tag-label { font-family: 'SF Mono', Consolas, monospace; font-size: 9.5px; font-weight: 700; fill: #ffffff; }
  </style>

  <rect width="480" height="270" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
  <rect x="0" y="0" width="480" height="4" rx="2" fill="#10b981" />

  <g transform="translate(22, 20)">
    <rect width="145" height="22" rx="6" fill="#047857" />
    <circle cx="11" cy="11" r="3.5" fill="#a7f3d0" />
    <text x="22" y="14.5" class="type-pill">PSYCHIC / GRASS</text>

    <text x="436" y="15" text-anchor="end" class="dex-num">DEX // #004 &#8226; AI ANALYTICS</text>
  </g>

  <text x="22" y="70" class="card-title">EducaIA</text>
  <text x="22" y="90" class="card-role">Educational Intelligence &#8226; Machine Learning Analytics</text>

  <line x1="22" y1="102" x2="458" y2="102" stroke="#21262d" stroke-width="1.5" />

  <text x="22" y="124" class="card-desc">Machine learning data pipelines and predictive models that transform</text>
  <text x="22" y="142" class="card-desc">institutional student metrics into actionable pedagogical interventions.</text>

  <g transform="translate(22, 158)">
    <rect width="436" height="42" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <text x="14" y="16" class="ability-title">SPECIAL ABILITY // COGNITIVE FORECAST</text>
    <text x="14" y="32" class="ability-text">&#9658; Objective predictive analytics to identify risk areas &amp; guide decisions</text>
  </g>

  <g transform="translate(22, 222)">
    <rect width="78" height="24" rx="6" fill="#047857" />
    <text x="14" y="16" class="tag-label">PYTHON</text>

    <g transform="translate(86, 0)">
      <rect width="78" height="24" rx="6" fill="#0369a1" />
      <text x="14" y="16" class="tag-label">ML / AI</text>
    </g>

    <g transform="translate(172, 0)">
      <rect width="90" height="24" rx="6" fill="#854d0e" />
      <text x="12" y="16" class="tag-label">ANALYTICS</text>
    </g>

    <g transform="translate(270, 0)">
      <rect width="90" height="24" rx="6" fill="#701a75" />
      <text x="12" y="16" class="tag-label">METRICS</text>
    </g>
  </g>
</svg>