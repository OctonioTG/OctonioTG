<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 210" width="100%" height="100%">
  <defs>
    <linearGradient id="edTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="60%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <radialGradient id="edSpot" cx="0%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#161b22" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #ffffff; }
    .badge { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #34d399; }
    .desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12.5px; fill: #94a3b8; line-height: 1.5; }
    .pill { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10.5px; font-weight: 600; fill: #e2e8f0; }
  </style>

  <rect width="460" height="210" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.2" />
  <rect width="460" height="210" rx="12" fill="url(#edSpot)" />

  <path d="M 12 1 L 448 1" stroke="url(#edTop)" stroke-width="2.5" stroke-linecap="round" />

  <g transform="translate(24, 24)">
    <rect width="32" height="32" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1" />
    <!-- Brain / Analytics Node Icon -->
    <circle cx="16" cy="14" r="3" fill="#34d399" />
    <circle cx="11" cy="20" r="2.5" fill="#34d399" />
    <circle cx="21" cy="20" r="2.5" fill="#34d399" />
    <line x1="16" y1="14" x2="11" y2="20" stroke="#34d399" stroke-width="1.2" />
    <line x1="16" y1="14" x2="21" y2="20" stroke="#34d399" stroke-width="1.2" />
    <line x1="11" y1="20" x2="21" y2="20" stroke="#34d399" stroke-width="1.2" />

    <text x="44" y="15" class="title">EducaIA</text>
    <text x="44" y="30" class="badge">Learning Analytics &#8226; Machine Learning</text>
  </g>

  <text x="24" y="88" class="desc">Data pipelines and predictive models that turn academic performance</text>
  <text x="24" y="108" class="desc">metrics into actionable insights to improve educational outcomes.</text>

  <line x1="24" y1="132" x2="436" y2="132" stroke="#21262d" stroke-width="1" />

  <g transform="translate(24, 154)">
    <rect width="66" height="24" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <circle cx="12" cy="12" r="3" fill="#10b981" />
    <text x="20" y="15.5" class="pill">Python</text>

    <g transform="translate(74, 0)">
      <rect width="76" height="24" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
      <circle cx="12" cy="12" r="3" fill="#38bdf8" />
      <text x="20" y="15.5" class="pill">ML / AI</text>
    </g>

    <g transform="translate(158, 0)">
      <rect width="80" height="24" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
      <circle cx="12" cy="12" r="3" fill="#fbbf24" />
      <text x="20" y="15.5" class="pill">Analytics</text>
    </g>

    <g transform="translate(246, 0)">
      <rect width="82" height="24" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
      <circle cx="12" cy="12" r="3" fill="#ec4899" />
      <text x="20" y="15.5" class="pill">Statistics</text>
    </g>
