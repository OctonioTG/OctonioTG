<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 185" width="100%" height="100%">
  <style>
    .type-pill { font-family: 'SF Mono', Consolas, monospace; font-size: 10.5px; font-weight: 800; fill: #ffffff; letter-spacing: 1px; }
    .dex-num { font-family: 'SF Mono', Consolas, monospace; font-size: 11px; font-weight: 700; fill: #c084fc; letter-spacing: 1px; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 21px; font-weight: 800; fill: #ffffff; letter-spacing: -0.3px; }
    .card-role { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #c084fc; }
    .card-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; fill: #cbd5e1; }
    .ability-title { font-family: 'SF Mono', Consolas, monospace; font-size: 10px; font-weight: 800; fill: #c084fc; letter-spacing: 1px; }
    .ability-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; fill: #f8fafc; font-weight: 500; }
    .tag-label { font-family: 'SF Mono', Consolas, monospace; font-size: 9.5px; font-weight: 700; fill: #ffffff; }
  </style>

  <rect width="850" height="185" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
  <rect x="0" y="0" width="6" height="185" rx="3" fill="#a855f7" />

  <!-- Top Line: Type & Dex -->
  <g transform="translate(26, 18)">
    <rect width="145" height="22" rx="6" fill="#6b21a8" />
    <circle cx="11" cy="11" r="3.5" fill="#e9d5ff" />
    <text x="22" y="14.5" class="type-pill">GHOST / PSYCHIC</text>
    <text x="796" y="15" text-anchor="end" class="dex-num">DEX // #004 &#8226; LEGAL ARCHIVE RECORDS</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="26" y="66" class="card-title">Fiscal&#237;a &#8226; Document Lifecycle &amp; Archive System</text>
  <text x="26" y="86" class="card-role">Document Automation &#8226; Records Management &amp; Process Digitalization</text>

  <!-- Description -->
  <text x="26" y="112" class="card-desc">Document management platform to register legal records, track physical archive locations, and automate remaining useful-life lifecycle monitoring.</text>

  <!-- Ability & Tags Row -->
  <g transform="translate(26, 132)">
    <rect width="455" height="36" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <text x="12" y="14" class="ability-title">SPECIAL ABILITY // LIFECYCLE TRACEABILITY</text>
    <text x="12" y="28" class="ability-text">&#9658; Automated document lifecycle tracking &amp; physical archive location control</text>

    <!-- Tags Right -->
    <g transform="translate(470, 6)">
      <rect width="135" height="24" rx="5" fill="#6b21a8" />
      <text x="8" y="16" class="tag-label">DOC TRACEABILITY</text>

      <g transform="translate(143, 0)">
        <rect width="112" height="24" rx="5" fill="#0369a1" />
        <text x="8" y="16" class="tag-label">DIGITALIZATION</text>
      </g>

      <g transform="translate(263, 0)">
        <rect width="85" height="24" rx="5" fill="#0f766e" />
        <text x="8" y="16" class="tag-label">COMPLIANCE</text>
      </g>
    </g>
  </g>
</svg>