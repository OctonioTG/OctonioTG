<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" width="100%" height="100%">
  <style>
    .type-pill { font-family: 'SF Mono', Consolas, monospace; font-size: 9.5px; font-weight: 800; fill: #ffffff; letter-spacing: 0.8px; }
    .dex-num { font-family: 'SF Mono', Consolas, monospace; font-size: 9.5px; font-weight: 700; fill: #c084fc; letter-spacing: 0.8px; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 16px; font-weight: 800; fill: #ffffff; letter-spacing: -0.2px; }
    .card-role { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; font-weight: 600; fill: #c084fc; }
    .card-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; fill: #cbd5e1; }
    .ability-title { font-family: 'SF Mono', Consolas, monospace; font-size: 8.5px; font-weight: 800; fill: #c084fc; letter-spacing: 0.8px; }
    .ability-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; fill: #f8fafc; font-weight: 500; }
    .tag-label { font-family: 'SF Mono', Consolas, monospace; font-size: 8.5px; font-weight: 700; fill: #ffffff; }
  </style>

  <!-- Card Base -->
  <rect width="420" height="220" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
  <rect x="0" y="0" width="5" height="220" rx="2.5" fill="#a855f7" />

  <!-- Top Line: Type Pill & Dex -->
  <g transform="translate(16, 15)">
    <rect width="135" height="20" rx="5" fill="#6b21a8" />
    <circle cx="10" cy="10" r="3" fill="#e9d5ff" />
    <text x="20" y="13.5" class="type-pill">GHOST / PSYCHIC</text>
    <text x="388" y="13.5" text-anchor="end" class="dex-num">DEX // #004 &#8226; LEGAL ARCHIVE</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="16" y="58" class="card-title">Fiscal&#237;a Archive System</text>
  <text x="16" y="75" class="card-role">Document Automation &#8226; Digitalization</text>

  <!-- Divider -->
  <line x1="16" y1="86" x2="404" y2="86" stroke="#21262d" stroke-width="1" />

  <!-- Description (2 Lines) -->
  <text x="16" y="104" class="card-desc">Document management platform to register records,</text>
  <text x="16" y="120" class="card-desc">track physical locations, and monitor useful-life.</text>

  <!-- Special Ability Box -->
  <g transform="translate(16, 134)">
    <rect width="388" height="38" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <text x="10" y="14" class="ability-title">SPECIAL ABILITY // LIFECYCLE TRACEABILITY</text>
    <text x="10" y="28" class="ability-text">&#9658; Document lifecycle tracking &amp; physical archive control</text>
  </g>

  <!-- Tags Row -->
  <g transform="translate(16, 184)">
    <rect width="120" height="22" rx="4" fill="#6b21a8" />
    <text x="8" y="15" class="tag-label">DOC TRACEABILITY</text>

    <g transform="translate(126, 0)">
      <rect width="104" height="22" rx="4" fill="#0369a1" />
      <text x="8" y="15" class="tag-label">DIGITALIZATION</text>
    </g>

    <g transform="translate(236, 0)">
      <rect width="84" height="22" rx="4" fill="#0f766e" />
      <text x="8" y="15" class="tag-label">COMPLIANCE</text>
    </g>
  </g>
</svg>