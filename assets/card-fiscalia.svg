<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="100%" height="100%">
  <style>
    .type-pill { font-family: 'SF Mono', Consolas, monospace; font-size: 10px; font-weight: 800; fill: #ffffff; letter-spacing: 1px; }
    .dex-num { font-family: 'SF Mono', Consolas, monospace; font-size: 10px; font-weight: 700; fill: #c084fc; letter-spacing: 1px; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 20px; font-weight: 800; fill: #ffffff; letter-spacing: -0.3px; }
    .card-role { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #c084fc; }
    .card-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12.5px; fill: #94a3b8; }
    .ability-title { font-family: 'SF Mono', Consolas, monospace; font-size: 10px; font-weight: 800; fill: #c084fc; letter-spacing: 1.2px; }
    .ability-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #cbd5e1; font-weight: 500; }
    .tag-label { font-family: 'SF Mono', Consolas, monospace; font-size: 9px; font-weight: 700; fill: #ffffff; }
  </style>

  <!-- Solid Dark Card Base -->
  <rect width="480" height="270" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5" />

  <!-- Solid Top Accent Bar (Justice Purple) -->
  <rect x="0" y="0" width="480" height="4" rx="2" fill="#c084fc" />

  <!-- Top Bar: Type Pill & Dex ID -->
  <g transform="translate(22, 20)">
    <rect width="145" height="22" rx="6" fill="#6b21a8" />
    <circle cx="11" cy="11" r="3.5" fill="#e9d5ff" />
    <text x="22" y="14.5" class="type-pill">GHOST / PSYCHIC</text>

    <text x="436" y="15" text-anchor="end" class="dex-num">DEX // #004 &#8226; LEGAL ARCHIVE</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="22" y="70" class="card-title">Fiscalía Archive System</text>
  <text x="22" y="90" class="card-role">Document Lifecycle &amp; Archive Tracking &#8226; Legal Records</text>

  <!-- Solid Divider Line -->
  <line x1="22" y1="102" x2="458" y2="102" stroke="#21262d" stroke-width="1.5" />

  <!-- Description -->
  <text x="22" y="124" class="card-desc">Document management platform to register legal records, track physical</text>
  <text x="22" y="142" class="card-desc">archive locations, and automate remaining useful-life lifecycle monitoring.</text>

  <!-- Pokédex Ability Box (Solid Background) -->
  <g transform="translate(22, 158)">
    <rect width="436" height="42" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <text x="14" y="16" class="ability-title">SPECIAL ABILITY // LIFECYCLE TRACEABILITY</text>
    <text x="14" y="32" class="ability-text">&#9658; Automated document lifecycle tracking &amp; physical archive location control</text>
  </g>

  <!-- Bottom Solid Tags -->
  <g transform="translate(22, 222)">
    <rect width="112" height="24" rx="6" fill="#6b21a8" />
    <text x="11" y="16" class="tag-label">DOC TRACEABILITY</text>

    <g transform="translate(120, 0)">
      <rect width="90" height="24" rx="6" fill="#0369a1" />
      <text x="11" y="16" class="tag-label">AUTOMATION</text>
    </g>

    <g transform="translate(218, 0)">
      <rect width="98" height="24" rx="6" fill="#0f766e" />
      <text x="10" y="16" class="tag-label">DIGITALIZATION</text>
    </g>

    <g transform="translate(324, 0)">
      <rect width="90" height="24" rx="6" fill="#854d0e" />
      <text x="11" y="16" class="tag-label">COMPLIANCE</text>
    </g>
  </g>
</svg>
