<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="100%" height="100%">
  <defs>
    <linearGradient id="cardRfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#200730" />
      <stop offset="40%" stop-color="#0c1024" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Holo Border Ghost/Electric -->
    <linearGradient id="holoRf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="35%" stop-color="#f43f5e" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <radialGradient id="glowRf" cx="85%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#f43f5e" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .type-pill { font-family: 'SF Mono', Consolas, monospace; font-size: 10px; font-weight: 800; fill: #ffffff; letter-spacing: 1px; }
    .dex-num { font-family: 'SF Mono', Consolas, monospace; font-size: 10px; font-weight: 700; fill: #c084fc; letter-spacing: 1px; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 20px; font-weight: 900; fill: #ffffff; letter-spacing: -0.3px; }
    .card-role { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #c084fc; }
    .card-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12.5px; fill: #cbd5e1; }
    .ability-title { font-family: 'SF Mono', Consolas, monospace; font-size: 10px; font-weight: 800; fill: #c084fc; letter-spacing: 1.2px; }
    .ability-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #fbcfe8; font-weight: 500; }
    .tag-label { font-family: 'SF Mono', Consolas, monospace; font-size: 9.5px; font-weight: 800; fill: #ffffff; }
  </style>

  <rect width="480" height="270" rx="16" fill="url(#cardRfBg)" stroke="#30363d" stroke-width="1.2" />
  <rect width="480" height="270" rx="16" fill="url(#glowRf)" />
  <rect x="2" y="2" width="476" height="266" rx="14" fill="none" stroke="url(#holoRf)" stroke-width="2" />

  <!-- Cyber Pokeball Watermark -->
  <g transform="translate(400, 75)" opacity="0.12">
    <circle cx="0" cy="0" r="55" fill="none" stroke="#c084fc" stroke-width="3" />
    <path d="M -55 0 A 55 55 0 0 1 55 0 Z" fill="#c084fc" />
    <line x1="-55" y1="0" x2="55" y2="0" stroke="#ffffff" stroke-width="3" />
    <circle cx="0" cy="0" r="16" fill="#0c1024" stroke="#ffffff" stroke-width="3" />
    <circle cx="0" cy="0" r="7" fill="#f43f5e" />
  </g>

  <!-- Top Bar: Type Pill & Dex ID -->
  <g transform="translate(22, 18)">
    <rect width="145" height="22" rx="11" fill="#6b21a8" stroke="#c084fc" stroke-width="1.2" />
    <circle cx="11" cy="11" r="4" fill="#f43f5e" />
    <text x="22" y="14.5" class="type-pill">GHOST / ELECTRIC</text>

    <text x="436" y="15" text-anchor="end" class="dex-num">DEX // #003 &#8226; SDR SPECTRAL</text>
  </g>

  <text x="22" y="68" class="card-title">RF Scanner</text>
  <text x="22" y="87" class="card-role">Software-Defined Radio &#8226; Applied Physics &amp; Signal Analysis</text>

  <line x1="22" y1="98" x2="458" y2="98" stroke="#334155" stroke-width="1" />
  <line x1="22" y1="98" x2="160" y2="98" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round" />

  <text x="22" y="120" class="card-desc">Real-time spectrum scanner utilizing SDR hardware, Python signal</text>
  <text x="22" y="138" class="card-desc">processing (FFT), and an interactive React waterfall visualization.</text>

  <!-- Ability Box -->
  <g transform="translate(22, 154)">
    <rect width="436" height="42" rx="8" fill="#3b0f34" stroke="#9d174d" stroke-width="1.2" />
    <text x="14" y="16" class="ability-title">SPECIAL ABILITY // SPECTRUM HARVEST</text>
    <text x="14" y="32" class="ability-text">&#9658; Live waterfall FFT visualization &amp; automated frequency sweeps</text>
  </g>

  <!-- Bottom Badges -->
  <g transform="translate(22, 218)">
    <rect width="65" height="24" rx="6" fill="#6b21a8" stroke="#c084fc" stroke-width="1.2" />
    <text x="16" y="16" class="tag-label">SDR</text>

    <g transform="translate(73, 0)">
      <rect width="78" height="24" rx="6" fill="#9d174d" stroke="#f43f5e" stroke-width="1.2" />
      <text x="13" y="16" class="tag-label">PYTHON</text>
    </g>

    <g transform="translate(159, 0)">
      <rect width="90" height="24" rx="6" fill="#0369a1" stroke="#38bdf8" stroke-width="1.2" />
      <text x="11" y="16" class="tag-label">DSP / FFT</text>
    </g>

    <g transform="translate(257, 0)">
      <rect width="112" height="24" rx="6" fill="#0f766e" stroke="#2dd4bf" stroke-width="1.2" />
      <text x="11" y="16" class="tag-label">ENG. PHYSICS</text>
    </g>
  </g>
</svg>