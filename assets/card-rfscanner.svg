<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 210" width="100%" height="100%">
  <defs>
    <linearGradient id="rfTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="60%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <radialGradient id="rfSpot" cx="0%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#161b22" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #ffffff; }
    .badge { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #c084fc; }
    .desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12.5px; fill: #94a3b8; line-height: 1.5; }
    .pill { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10.5px; font-weight: 600; fill: #e2e8f0; }
  </style>

  <rect width="460" height="210" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.2" />
  <rect width="460" height="210" rx="12" fill="url(#rfSpot)" />

  <path d="M 12 1 L 448 1" stroke="url(#rfTop)" stroke-width="2.5" stroke-linecap="round" />

  <g transform="translate(24, 24)">
    <rect width="32" height="32" rx="8" fill="#3b0764" stroke="#7e22ce" stroke-width="1" />
    <!-- Radio Signal Wave Icon -->
    <circle cx="16" cy="18" r="2.5" fill="#c084fc" />
    <path d="M 12 14 A 6 6 0 0 1 20 14" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 9 11 A 10 10 0 0 1 23 11" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-linecap="round" />

    <text x="44" y="15" class="title">RF Scanner</text>
    <text x="44" y="30" class="badge">SDR Telemetry &bull; Applied Physics</text>
  </g>

  <text x="24" y="88" class="desc">Real-time spectrum analysis system combining SDR hardware,</text>
  <text x="24" y="108" class="desc">Python DSP algorithms, and interactive React waterfall visualization.</text>

  <line x1="24" y1="132" x2="436" y2="132" stroke="#21262d" stroke-width="1" />

  <g transform="translate(24, 154)">
    <rect width="56" height="24" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <circle cx="12" cy="12" r="3" fill="#c084fc" />
    <text x="20" y="15.5" class="pill">SDR</text>

    <g transform="translate(64, 0)">
      <rect width="66" height="24" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
      <circle cx="12" cy="12" r="3" fill="#f43f5e" />
      <text x="20" y="15.5" class="pill">Python</text>
    </g>

    <g transform="translate(138, 0)">
      <rect width="84" height="24" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
      <circle cx="12" cy="12" r="3" fill="#38bdf8" />
      <text x="20" y="15.5" class="pill">DSP / FFT</text>
    </g>

    <g transform="translate(230, 0)">
      <rect width="102" height="24" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
      <circle cx="12" cy="12" r="3" fill="#a855f7" />
      <text x="20" y="15.5" class="pill">Eng. Physics</text>
    </g>
  </g>
</svg>