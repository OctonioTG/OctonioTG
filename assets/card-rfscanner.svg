<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 250" width="100%" height="100%">
  <defs>
    <linearGradient id="rfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#210833" />
      <stop offset="50%" stop-color="#0c1228" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="rfBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="40%" stop-color="#f43f5e" />
      <stop offset="80%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <radialGradient id="rfGlow" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .cat-tag { font-family: 'SF Mono', Consolas, monospace; font-size: 9.5px; font-weight: 800; fill: #c084fc; letter-spacing: 1.5px; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 17.5px; font-weight: 800; fill: #ffffff; letter-spacing: -0.3px; }
    .card-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; font-weight: 600; fill: #f43f5e; }
    .card-body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #cbd5e1; line-height: 1.4; }
    .impact-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #fbcfe8; }
    .tag-text { font-family: 'SF Mono', Consolas, monospace; font-size: 9px; font-weight: 700; fill: #ffffff; }
  </style>

  <rect width="440" height="250" rx="14" fill="url(#rfBg)" />
  <rect width="440" height="250" rx="14" fill="url(#rfGlow)" />
  <rect x="1" y="1" width="438" height="248" rx="13" fill="none" stroke="url(#rfBorder)" stroke-width="1.8" />

  <rect x="20" y="18" width="168" height="18" rx="4" fill="#3b0764" stroke="#c084fc" stroke-width="1" />
  <circle cx="28" cy="27" r="3" fill="#c084fc" />
  <text x="36" y="30.5" class="cat-tag">APPLIED PHYSICS &amp; SDR</text>

  <text x="20" y="58" class="card-title">RF Scanner &bull; Signal Analysis</text>
  <text x="20" y="76" class="card-sub">Software-Defined Radio &amp; Spectrum Diagnostics</text>

  <line x1="20" y1="88" x2="420" y2="88" stroke="#334155" stroke-width="1" />
  <line x1="20" y1="88" x2="160" y2="88" stroke="#c084fc" stroke-width="2" stroke-linecap="round" />

  <text x="20" y="108" class="card-body">Integrates SDR hardware, a Python DSP backend, and React</text>
  <text x="20" y="125" class="card-body">waterfall visualization to inspect live radio frequency bands.</text>

  <g transform="translate(20, 142)">
    <rect width="400" height="32" rx="6" fill="#37102e" stroke="#9d174d" stroke-width="1" />
    <circle cx="15" cy="16" r="3.5" fill="#f43f5e" />
    <text x="26" y="20" class="impact-text">&bull; Real-time FFT waterfall display &amp; accessible frequency sweeps</text>
  </g>

  <g transform="translate(20, 192)">
    <rect width="56" height="22" rx="5" fill="#6b21a8" stroke="#c084fc" stroke-width="1" />
    <text x="14" y="15" class="tag-text">SDR</text>

    <g transform="translate(62, 0)">
      <rect width="68" height="22" rx="5" fill="#9d174d" stroke="#f43f5e" stroke-width="1" />
      <text x="11" y="15" class="tag-text">PYTHON</text>
    </g>

    <g transform="translate(136, 0)">
      <rect width="78" height="22" rx="5" fill="#0369a1" stroke="#38bdf8" stroke-width="1" />
      <text x="10" y="15" class="tag-text">DSP / FFT</text>
    </g>

    <g transform="translate(220, 0)">
      <rect width="90" height="22" rx="5" fill="#0f766e" stroke="#2dd4bf" stroke-width="1" />
      <text x="10" y="15" class="tag-text">ENG.PHYSICS</text>
    </g>
  </g>
</svg>
