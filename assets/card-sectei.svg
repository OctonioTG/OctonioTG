<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 210" width="100%" height="100%">
  <defs>
    <linearGradient id="scTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <radialGradient id="scSpot" cx="0%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#161b22" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #ffffff; }
    .badge { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #38bdf8; }
    .desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12.5px; fill: #94a3b8; line-height: 1.5; }
    .pill { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10.5px; font-weight: 600; fill: #e2e8f0; }
  </style>

  <rect width="460" height="210" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.2" />
  <rect width="460" height="210" rx="12" fill="url(#scSpot)" />

  <path d="M 12 1 L 448 1" stroke="url(#scTop)" stroke-width="2.5" stroke-linecap="round" />

  <g transform="translate(24, 24)">
    <rect width="32" height="32" rx="8" fill="#082f49" stroke="#0284c7" stroke-width="1" />
    <!-- Window / Layout Icon -->
    <rect x="9" y="9" width="14" height="14" rx="2" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="9" y1="13" x2="23" y2="13" stroke="#38bdf8" stroke-width="1" />
    <line x1="14" y1="13" x2="14" y2="23" stroke="#38bdf8" stroke-width="1" />

    <text x="44" y="15" class="title">SECTEI Builder</text>
    <text x="44" y="30" class="badge">Modular UI Platform &#8226; Frontend</text>
  </g>

  <text x="24" y="88" class="desc">A modular visual layout engine built on reusable components to</text>
  <text x="24" y="108" class="desc">speed up web prototyping and enforce consistent design systems.</text>

  <line x1="24" y1="132" x2="436" y2="132" stroke="#21262d" stroke-width="1" />

  <g transform="translate(24, 154)">
    <rect width="60" height="24" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <circle cx="12" cy="12" r="3" fill="#38bdf8" />
    <text x="20" y="15.5" class="pill">React</text>

    <g transform="translate(68, 0)">
      <rect width="70" height="24" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
      <circle cx="12" cy="12" r="3" fill="#ffffff" />
      <text x="20" y="15.5" class="pill">Next.js</text>
    </g>

    <g transform="translate(146, 0)">
      <rect width="74" height="24" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
      <circle cx="12" cy="12" r="3" fill="#2dd4bf" />
      <text x="20" y="15.5" class="pill">Tailwind</text>
    </g>

    <g transform="translate(228, 0)">
      <rect width="88" height="24" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
      <circle cx="12" cy="12" r="3" fill="#facc15" />
      <text x="20" y="15.5" class="pill">JavaScript</text>
    </g>
  </g>
</svg>