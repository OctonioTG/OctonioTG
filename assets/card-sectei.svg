<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 250" width="100%" height="100%">
  <defs>
    <linearGradient id="scBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051c2c" />
      <stop offset="50%" stop-color="#0c162a" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="scBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="80%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <radialGradient id="scGlow" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .cat-tag { font-family: 'SF Mono', Consolas, monospace; font-size: 9.5px; font-weight: 800; fill: #00f2fe; letter-spacing: 1.5px; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 17.5px; font-weight: 800; fill: #ffffff; letter-spacing: -0.3px; }
    .card-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; font-weight: 600; fill: #38bdf8; }
    .card-body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #cbd5e1; line-height: 1.4; }
    .impact-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #bae6fd; }
    .tag-text { font-family: 'SF Mono', Consolas, monospace; font-size: 9px; font-weight: 700; fill: #ffffff; }
  </style>

  <rect width="440" height="250" rx="14" fill="url(#scBg)" />
  <rect width="440" height="250" rx="14" fill="url(#scGlow)" />
  <rect x="1" y="1" width="438" height="248" rx="13" fill="none" stroke="url(#scBorder)" stroke-width="1.8" />

  <rect x="20" y="18" width="168" height="18" rx="4" fill="#082f49" stroke="#00f2fe" stroke-width="1" />
  <circle cx="28" cy="27" r="3" fill="#00f2fe" />
  <text x="36" y="30.5" class="cat-tag">FRONTEND ARCHITECTURE</text>

  <text x="20" y="58" class="card-title">SECTEI Builder &bull; UI Engine</text>
  <text x="20" y="76" class="card-sub">Modular Visual Web Layout Platform</text>

  <line x1="20" y1="88" x2="420" y2="88" stroke="#334155" stroke-width="1" />
  <line x1="20" y1="88" x2="160" y2="88" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" />

  <text x="20" y="108" class="card-body">Modular platform powered by reusable components designed to</text>
  <text x="20" y="125" class="card-body">accelerate interface prototyping and standardize web systems.</text>

  <g transform="translate(20, 142)">
    <rect width="400" height="32" rx="6" fill="#0c2d48" stroke="#0284c7" stroke-width="1" />
    <circle cx="15" cy="16" r="3.5" fill="#38bdf8" />
    <text x="26" y="20" class="impact-text">&bull; Accelerated layout delivery &amp; eliminated frontend boilerplate</text>
  </g>

  <g transform="translate(20, 192)">
    <rect width="64" height="22" rx="5" fill="#0369a1" stroke="#38bdf8" stroke-width="1" />
    <text x="12" y="15" class="tag-text">REACT</text>

    <g transform="translate(70, 0)">
      <rect width="70" height="22" rx="5" fill="#312e81" stroke="#818cf8" stroke-width="1" />
      <text x="11" y="15" class="tag-text">NEXT.JS</text>
    </g>

    <g transform="translate(146, 0)">
      <rect width="78" height="22" rx="5" fill="#115e59" stroke="#2dd4bf" stroke-width="1" />
      <text x="10" y="15" class="tag-text">TAILWIND</text>
    </g>

    <g transform="translate(230, 0)">
      <rect width="90" height="22" rx="5" fill="#581c87" stroke="#c084fc" stroke-width="1" />
      <text x="10" y="15" class="tag-text">COMPONENTS</text>
    </g>
  </g>
</svg>
