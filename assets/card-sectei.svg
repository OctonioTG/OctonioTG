<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="100%" height="100%">
  <style>
    .type-pill { font-family: 'SF Mono', Consolas, monospace; font-size: 10px; font-weight: 800; fill: #ffffff; letter-spacing: 1px; }
    .dex-num { font-family: 'SF Mono', Consolas, monospace; font-size: 10px; font-weight: 700; fill: #38bdf8; letter-spacing: 1px; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 20px; font-weight: 800; fill: #ffffff; letter-spacing: -0.3px; }
    .card-role { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #38bdf8; }
    .card-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12.5px; fill: #94a3b8; }
    .ability-title { font-family: 'SF Mono', Consolas, monospace; font-size: 10px; font-weight: 800; fill: #38bdf8; letter-spacing: 1.2px; }
    .ability-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #cbd5e1; font-weight: 500; }
    .tag-label { font-family: 'SF Mono', Consolas, monospace; font-size: 9.5px; font-weight: 700; fill: #ffffff; }
  </style>

  <rect width="480" height="270" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
  <rect x="0" y="0" width="480" height="4" rx="2" fill="#38bdf8" />

  <g transform="translate(22, 20)">
    <rect width="145" height="22" rx="6" fill="#0369a1" />
    <circle cx="11" cy="11" r="3.5" fill="#bae6fd" />
    <text x="22" y="14.5" class="type-pill">WATER / ELECTRIC</text>

    <text x="436" y="15" text-anchor="end" class="dex-num">DEX // #002 &#8226; UI PLATFORM</text>
  </g>

  <text x="22" y="70" class="card-title">SECTEI Builder</text>
  <text x="22" y="90" class="card-role">Modular Component Engine &#8226; Visual Layout Platform</text>

  <line x1="22" y1="102" x2="458" y2="102" stroke="#21262d" stroke-width="1.5" />

  <text x="22" y="124" class="card-desc">Visual web interface engine powered by reusable, atomic components</text>
  <text x="22" y="142" class="card-desc">engineered to eliminate boilerplate and accelerate layout assembly.</text>

  <g transform="translate(22, 158)">
    <rect width="436" height="42" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <text x="14" y="16" class="ability-title">SPECIAL ABILITY // ATOMIC MODULARITY</text>
    <text x="14" y="32" class="ability-text">&#9658; 10x faster layout prototyping with enforced design systems</text>
  </g>

  <g transform="translate(22, 222)">
    <rect width="72" height="24" rx="6" fill="#0369a1" />
    <text x="13" y="16" class="tag-label">REACT</text>

    <g transform="translate(80, 0)">
      <rect width="80" height="24" rx="6" fill="#312e81" />
      <text x="12" y="16" class="tag-label">NEXT.JS</text>
    </g>

    <g transform="translate(168, 0)">
      <rect width="88" height="24" rx="6" fill="#115e59" />
      <text x="11" y="16" class="tag-label">TAILWIND</text>
    </g>

    <g transform="translate(264, 0)">
      <rect width="98" height="24" rx="6" fill="#581c87" />
      <text x="11" y="16" class="tag-label">UI ENGINE</text>
    </g>
  </g>
</svg>