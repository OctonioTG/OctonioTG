<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 115" width="100%" height="100%">
  <style>
    .cat-pill { font-family: 'SF Mono', Consolas, monospace; font-size: 9.5px; font-weight: 700; fill: #ffffff; }
    .cat-items { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; fill: #cbd5e1; }
  </style>

  <!-- Card Background -->
  <rect width="850" height="115" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5" />

  <!-- Left Accent Bar -->
  <rect x="0" y="0" width="6" height="115" rx="3" fill="#f97316" />

  <!-- Row 1: Languages -->
  <g transform="translate(28, 16)">
    <rect width="86" height="22" rx="5" fill="#9a3412" />
    <text x="10" y="15" class="cat-pill">LANGUAGES</text>
    <text x="100" y="15.5" class="cat-items">Python, JavaScript (ES6+), SQL, HTML5, CSS3</text>
  </g>

  <!-- Row 2: Frontend -->
  <g transform="translate(28, 48)">
    <rect width="86" height="22" rx="5" fill="#0369a1" />
    <text x="14" y="15" class="cat-pill">FRONTEND</text>
    <text x="100" y="15.5" class="cat-items">React, Next.js, Tailwind CSS, Responsive Design, State Management</text>
  </g>

  <!-- Row 3: Backend & Data -->
  <g transform="translate(28, 80)">
    <rect width="86" height="22" rx="5" fill="#065f46" />
    <text x="17" y="15" class="cat-pill">BACKEND</text>
    <text x="100" y="15.5" class="cat-items">Django, RESTful APIs, PostgreSQL, MySQL, MongoDB, Environment Setup</text>
  </g>
</svg>
