<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 68" width="100%" height="100%">
  <style>
    .btn-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #ffffff; }
    .btn-sub { font-family: 'SF Mono', Consolas, monospace; font-size: 11.5px; fill: #94a3b8; }
    .arrow { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #ea4335; }
  </style>

  <rect width="410" height="68" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2" />
  <rect x="0" y="0" width="5" height="68" rx="2.5" fill="#ea4335" />

  <!-- Gmail Envelope Icon -->
  <g transform="translate(18, 16)">
    <rect width="36" height="36" rx="6" fill="#381014" stroke="#ea4335" stroke-width="1" />
    <!-- Envelope Vector -->
    <rect x="7" y="10" width="22" height="16" rx="2" fill="none" stroke="#ea4335" stroke-width="1.8" />
    <path d="M 7 12 L 18 20 L 29 12" fill="none" stroke="#ea4335" stroke-width="1.8" stroke-linecap="round" />
  </g>

  <text x="68" y="32" class="btn-title">Email</text>
  <text x="68" y="50" class="btn-sub">diego.devworks@gmail.com</text>

  <text x="382" y="39" class="arrow">&#8594;</text>
</svg>
