<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 68" width="100%" height="100%">
  <style>
    .btn-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #ffffff; }
    .btn-sub { font-family: 'SF Mono', Consolas, monospace; font-size: 11.5px; fill: #94a3b8; }
    .arrow { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #0a66c2; }
  </style>

  <!-- Button Base -->
  <rect width="410" height="68" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2" />
  <rect x="0" y="0" width="5" height="68" rx="2.5" fill="#0a66c2" />

  <!-- LinkedIn Official Icon -->
  <g transform="translate(18, 16)">
    <rect width="36" height="36" rx="6" fill="#0a66c2" />
    <text x="18" y="25" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">in</text>
  </g>

  <!-- Label & Handle -->
  <text x="68" y="32" class="btn-title">LinkedIn</text>
  <text x="68" y="50" class="btn-sub">/in/jassiel-ovalle</text>

  <!-- Right Arrow -->
  <text x="382" y="39" class="arrow">&#8594;</text>
</svg>
