<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 68" width="100%" height="100%">
  <style>
    .btn-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #ffffff; }
    .btn-sub { font-family: 'SF Mono', Consolas, monospace; font-size: 11.5px; fill: #94a3b8; }
    .arrow { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #10b981; }
  </style>

  <rect width="410" height="68" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2" />
  <rect x="0" y="0" width="5" height="68" rx="2.5" fill="#10b981" />

  <!-- Web Globe / Portfolio Icon -->
  <g transform="translate(18, 16)">
    <rect width="36" height="36" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1" />
    <!-- Globe Vector -->
    <circle cx="18" cy="18" r="9" fill="none" stroke="#34d399" stroke-width="1.6" />
    <ellipse cx="18" cy="18" rx="4" ry="9" fill="none" stroke="#34d399" stroke-width="1.3" />
    <line x1="9" y1="18" x2="27" y2="18" stroke="#34d399" stroke-width="1.3" />
  </g>

  <text x="68" y="32" class="btn-title">Portfolio</text>
  <text x="68" y="50" class="btn-sub">diegoovalle.dev</text>

  <text x="382" y="39" class="arrow">&#8594;</text>
</svg>
