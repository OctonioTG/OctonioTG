<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 92" width="100%" height="92">
  <defs>
    <linearGradient id="pAzBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180e05" />
      <stop offset="50%" stop-color="#0e1322" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>
    <linearGradient id="pAzBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="35%" stop-color="#ef4444" />
      <stop offset="70%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>
  <style>
    .p-badge { font-family: 'SF Mono', Consolas, monospace; font-size: 10px; font-weight: 800; fill: #f97316; letter-spacing: 1.5px; }
    .p-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 19.5px; font-weight: 800; fill: #ffffff; }
    .p-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12.5px; fill: #cbd5e1; }
    .p-tag { font-family: 'SF Mono', Consolas, monospace; font-size: 10px; font-weight: 700; fill: #ffffff; }
  </style>

  <rect width="900" height="92" rx="12" fill="url(#pAzBg)" stroke="#334155" stroke-width="1.2" />
  <rect x="0" y="0" width="900" height="92" rx="12" fill="none" stroke="url(#pAzBorder)" stroke-width="2" stroke-dasharray="320 580" />

  <path d="M 14 26 L 14 14 L 26 14" fill="none" stroke="#f97316" stroke-width="2.5" />
  
  <text x="34" y="25" class="p-badge">ENTERPRISE // SUPPLY CHAIN &amp; COMPLIANCE</text>
  <text x="34" y="51" class="p-title">AutoZone &bull; Global Compliance Operational Tooling</text>
  <text x="34" y="73" class="p-sub">Internal automation, incident diagnostic pipelines, and operational workflow standardization.</text>

  <!-- Tags on Right (Vibrant colored badges) -->
  <g transform="translate(615, 30)">
    <rect width="80" height="24" rx="5" fill="#c2410c" stroke="#f97316" stroke-width="1.2" />
    <text x="14" y="16.5" class="p-tag">PYTHON</text>
    <rect x="88" width="95" height="24" rx="5" fill="#0369a1" stroke="#38bdf8" stroke-width="1.2" />
    <text x="96" y="16.5" class="p-tag">AUTOMATION</text>
    <rect x="191" width="70" height="24" rx="5" fill="#854d0e" stroke="#eab308" stroke-width="1.2" />
    <text x="202" y="16.5" class="p-tag">AUDIT</text>
  </g>
</svg>