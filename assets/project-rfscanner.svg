<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 90" width="100%" height="90">
  <defs>
    <linearGradient id="pRfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101d" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>
    <linearGradient id="pRfBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <style>
    .p-badge { font-family: 'SF Mono', Consolas, monospace; font-size: 9.5px; font-weight: 700; fill: #a855f7; letter-spacing: 1.5px; }
    .p-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 19px; font-weight: 800; fill: #ffffff; }
    .p-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #94a3b8; }
    .p-tag { font-family: 'SF Mono', Consolas, monospace; font-size: 10px; fill: #38bdf8; font-weight: 600; }
  </style>

  <rect width="900" height="90" rx="10" fill="url(#pRfBg)" stroke="#1e293b" stroke-width="1.2" />
  <rect x="0" y="0" width="900" height="90" rx="10" fill="none" stroke="url(#pRfBorder)" stroke-width="1.5" stroke-dasharray="250 650" />

  <path d="M 12 25 L 12 12 L 25 12" fill="none" stroke="#a855f7" stroke-width="2" />
  
  <text x="32" y="24" class="p-badge">APPLIED PHYSICS &amp; SYSTEMS // SDR TELEMETRY</text>
  <text x="32" y="49" class="p-title">RF Scanner &bull; Real-Time SDR Signal Monitoring &amp; Analysis</text>
  <text x="32" y="70" class="p-sub">Software-Defined Radio signal capture, FFT spectrum diagnostics, and interactive real-time visualization.</text>

  <g transform="translate(635, 28)">
    <rect width="60" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="17" y="15" class="p-tag">SDR</text>
    <rect x="68" width="75" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="79" y="15" class="p-tag">PYTHON</text>
    <rect x="151" width="90" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="160" y="15" class="p-tag">DSP / FFT</text>
  </g>
</svg>
