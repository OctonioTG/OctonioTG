<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 56" width="100%" height="56">
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 20px; font-weight: 800; fill: #ffffff; letter-spacing: 0.5px; }
    .badge { font-family: 'SF Mono', Consolas, monospace; font-size: 11px; font-weight: 700; fill: #38bdf8; letter-spacing: 1.5px; }
  </style>

  <!-- Card Background (Solid Flat Dark) -->
  <rect width="850" height="56" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5" />

  <!-- Left Solid Accent Bar -->
  <rect x="0" y="0" width="8" height="56" rx="4" fill="#38bdf8" />

  <!-- Title Text -->
  <text x="28" y="35" class="title">ABOUT ME</text>

  <!-- Right Pill -->
  <g transform="translate(685, 14)">
    <rect width="145" height="28" rx="6" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1" />
    <circle cx="14" cy="14" r="3.5" fill="#38bdf8" />
    <text x="26" y="18" class="badge">DEX // PROFILE</text>
  </g>
</svg>