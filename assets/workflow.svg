<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 135" width="100%" height="100%">
  <defs>
    <!-- Card Gradients -->
    <linearGradient id="card1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082f49" />
      <stop offset="100%" stop-color="#0b172a" />
    </linearGradient>
    <linearGradient id="card2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="card3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="card4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Pipeline Flow Glow -->
    <linearGradient id="flowRainbow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#a855f7" />
      <stop offset="70%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
  </defs>

  <style>
    .step-num { font-family: 'SF Mono', Consolas, monospace; font-size: 10px; font-weight: 800; letter-spacing: 1.5px; }
    .step-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: 800; fill: #ffffff; }
    .step-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; font-weight: 500; fill: #e2e8f0; }
  </style>

  <!-- Connecting Stream Line -->
  <line x1="120" y1="68" x2="800" y2="68" stroke="url(#flowRainbow)" stroke-width="3" stroke-dasharray="6 4" opacity="0.8" />

  <!-- STEP 1: UNDERSTAND (Electric Cyan) -->
  <g transform="translate(15, 15)">
    <rect width="195" height="105" rx="12" fill="url(#card1Grad)" stroke="#38bdf8" stroke-width="1.8" />
    <circle cx="24" cy="26" r="5" fill="#38bdf8" />
    <text x="36" y="30" class="step-num" fill="#38bdf8">01 // DIAGNOSE</text>
    <text x="22" y="58" class="step-title">Understand</text>
    <text x="22" y="78" class="step-desc">Root Cause Analysis</text>
    <text x="22" y="94" class="step-desc">5 Whys &amp; Ishikawa</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 220 68 L 232 68 M 227 63 L 233 68 L 227 73" stroke="#a855f7" stroke-width="2.5" fill="none" stroke-linecap="round" />

  <!-- STEP 2: ANALYZE (Laser Violet) -->
  <g transform="translate(245, 15)">
    <rect width="195" height="105" rx="12" fill="url(#card2Grad)" stroke="#c084fc" stroke-width="1.8" />
    <circle cx="24" cy="26" r="5" fill="#c084fc" />
    <text x="36" y="30" class="step-num" fill="#c084fc">02 // DECONSTRUCT</text>
    <text x="22" y="58" class="step-title">Analyze</text>
    <text x="22" y="78" class="step-desc">Process Mapping (BPMN)</text>
    <text x="22" y="94" class="step-desc">Bottlenecks &amp; Physics</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 450 68 L 462 68 M 457 63 L 463 68 L 457 73" stroke="#10b981" stroke-width="2.5" fill="none" stroke-linecap="round" />

  <!-- STEP 3: BUILD (Emerald Mint) -->
  <g transform="translate(475, 15)">
    <rect width="195" height="105" rx="12" fill="url(#card3Grad)" stroke="#34d399" stroke-width="1.8" />
    <circle cx="24" cy="26" r="5" fill="#34d399" />
    <text x="36" y="30" class="step-num" fill="#34d399">03 // ENGINEER</text>
    <text x="22" y="58" class="step-title">Build</text>
    <text x="22" y="78" class="step-desc">Full-Stack Development</text>
    <text x="22" y="94" class="step-desc">Workflow Automation</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M 680 68 L 692 68 M 687 63 L 693 68 L 687 73" stroke="#f97316" stroke-width="2.5" fill="none" stroke-linecap="round" />

  <!-- STEP 4: IMPROVE (Sunset Flame) -->
  <g transform="translate(705, 15)">
    <rect width="195" height="105" rx="12" fill="url(#card4Grad)" stroke="#fb923c" stroke-width="1.8" />
    <circle cx="24" cy="26" r="5" fill="#fb923c" />
    <text x="36" y="30" class="step-num" fill="#fb923c">04 // OPTIMIZE</text>
    <text x="22" y="58" class="step-title">Improve</text>
    <text x="22" y="78" class="step-desc">Kaizen &amp; Six Sigma</text>
    <text x="22" y="94" class="step-desc">Standardization &amp; QA</text>
  </g>
</svg>